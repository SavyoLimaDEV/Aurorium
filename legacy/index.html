function makeSchedule(tableId,start,end,days,repeat,time,duration,seriesId,limit=80){
 const result=[],wanted=(days||[]).map(Number),startD=new Date(start+'T12:00:00'),endD=new Date(end+'T12:00:00');
 if(!Number.isFinite(startD.getTime())||!Number.isFinite(endD.getTime())||endD<startD)return result;
 const maxDays=Math.min(370,Math.round((endD-startD)/86400000));
 for(let i=0;i<=maxDays&&result.length<limit;i++){
  const d=new Date(startD);d.setDate(startD.getDate()+i);
  if(repeat==='once'&&i!==0)break;
  if(repeat==='weekly'&&!wanted.includes(d.getDay()))continue;
  if(repeat==='biweekly'&&(!wanted.includes(d.getDay())||Math.floor(i/7)%2!==0))continue;
  if(repeat==='monthly'&&d.getDate()!==startD.getDate())continue;
  result.push({id:uid('s'),tableId,date:iso(d),time,title:'Sessão de campanha',status:'scheduled',seriesId,duration,attendance:{}});
 }
 return result;
}

function tableDetail(t){if(!t)return panel('Detalhes da mesa',empty('Selecione uma mesa para visualizar os detalhes.'));const c=comm(t.communityId),m=user(t.masterId),n=slots(t),r=db.requests.find(x=>x.tableId===t.id&&x.userId===currentId&&['pending','approved','waitlisted'].includes(x.status)),one=db.sessions.filter(s=>s.tableId===t.id&&s.status==='scheduled'&&s.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0];let actions='';
 if(me().role==='player'){
 if(r)actions=`${statusTag(r.status)} ${r.status==='waitlisted'&&n>0?btn('Solicitar vaga liberada','claim-vacancy',`data-id="${attr(r.id)}"`,'solidgreen'):r.status!=='approved'?btn('Cancelar solicitação','cancel-request',`data-id="${attr(r.id)}"`,'ghost'):btn('Minhas sessões','go-calendar','','ghost')}`;

 else actions=tag('Inscrições indisponíveis','red');
 }else if(masterAllowed(t))actions=btn('Gerenciar mesa','edit-table',`data-id="${attr(t.id)}"`,'solidgreen');
 else actions=btn('Visualizar calendário','go-calendar','','ghost');
 return `<section class="panel detail-panel"><div class="cover c${db.tables.indexOf(t)%5+1}"><span class="cover-mark">${esc(t.genre||'Campanha')}</span></div><div class="card-body"><span class="eyebrow" style="margin:0 0 7px">Detalhes da mesa</span><h2>${esc(t.name)}</h2><p>${esc(c?.name||'')} · Mestre ${esc(m?.name||'')}</p><div class="pillline">${tag(t.system,'gold')}${tag(t.mode)}${tag(t.status==='open'?(n?'Vagas disponíveis':'Lotada'):statusTxt(t.status),n===0?'red':'')}</div><div class="divider"></div><h3>Sobre a campanha</h3><p class="prewrap">${esc(t.description)}</p><div class="divider"></div><div class="panel-list"><div class="meta"><strong>Calendário:</strong> ${esc((t.days||[]).map(d=>dnames[d]).join(', ')||'Sessão única')}</div><div class="meta"><strong>Horário:</strong> ${esc(t.time)} · ${esc(t.duration)}h</div><div class="meta"><strong>Vagas:</strong> ${members(t.id).length} de ${esc(t.capacity)} ocupadas</div><div class="meta"><strong>Recorrência:</strong> ${esc(({weekly:'Semanal',biweekly:'Quinzenal',monthly:'Mensal',once:'Avulsa'})[t.recurrence]||t.recurrence)}</div>${one?`<div class="meta"><strong>Próxima sessão:</strong> ${prettyDate(one.date)}</div>`:''}</div><div class="divider"></div><h3>Regras</h3><p>${esc(t.rules||'Converse com o mestre sobre as regras de participação.')}</p><div class="form-actions" style="justify-content:flex-start">${actions}</div></div></section>`}
function homePage(){const active=db.tables.filter(t=>t.status==='open');return `<div class="site-container"><section class="hero"><div class="hero-content"><span class="eyebrow">Organize suas aventuras em um só lugar</span><h1>Suas aventuras começam com uma <span class="gold">comunidade organizada.</span></h1><p>Descubra mesas, reúna jogadores e simplifique a gestão de comunidades de RPG. Tudo em um único ambiente.</p><div class="hero-ctas"><button class="btn" data-route="explore">⚔ Explorar mesas</button><button class="btn ghost" data-route="communities">⬡ Ver comunidades</button><button class="btn neutral" data-route="dashboard">Acessar painel</button></div><div class="hero-tags"><span>Para jogadores</span><span>Para mestres</span><span>Para administradores</span></div></div></section><div class="stats" style="margin-top:14px">${stat('♙',db.users.length,'Membros cadastrados')}${stat('⚔',active.length,'Mesas ativas')}${stat('⬡',db.communities.length,'Comunidades')}${stat('✧',new Set(db.tables.map(t=>t.system)).size,'Sistemas de RPG')}</div><div class="home-sections"><section><div class="section-head"><h2>Comunidades em destaque</h2>${btn('Ver todas','go-communities')}</div><div class="card-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${db.communities.slice(0,4).map(communityCard).join('')}</div></section><section><div class="section-head"><h2>Mesas em destaque</h2>${btn('Explorar','go-explore')}</div>${panel('Encontre sua próxima aventura',`<div class="panel-list">${active.slice(0,5).map(t=>`<div class="list-row"><div class="info"><h4>${esc(t.name)}</h4><p>${esc(t.system)} · ${esc((t.days||[]).map(x=>weekdays[x]).join(', '))} ${esc(t.time)}</p></div>${tag(slots(t)?slots(t)+' vagas':'Lotada',slots(t)?'':'red')}${btn('Ver','select-table',`data-id="${attr(t.id)}"`)}</div>`).join('')}</div>`)}</section></div><div class="section-head"><h2>Uma plataforma para todos os perfis</h2></div><div class="feature-strip"><div class="feature"><strong>♙ Jogador</strong><span>Encontre mesas, acompanhe sessões e solicitações.</span></div><div class="feature"><strong>⚔ Mestre</strong><span>Publique mesas, gerencie vagas e presenças.</span></div><div class="feature"><strong>♜ Administrador</strong><span>Centralize membros, comunidades e mensalidades.</span></div></div><p class="footnote">Projeto acadêmico demonstrativo de gestão de RPG de mesa. Sem partidas virtuais e sem processamento de pagamentos.</p></div>`}

 return head('Explorar Mesas','Encontre sua próxima aventura e junte-se a uma mesa de RPG.',btn('Limpar filtros','clear-filters'))+`<form class="panel filterbar" id="filter-form"><div class="filtergrid"><div class="field" style="grid-column:span 2"><label for="qfilter">Buscar mesa, sistema ou mestre</label><input class="input" name="search" id="qfilter" placeholder="Ex.: Tormenta20, Eldrath..." value="${attr(filters.search)}"></div>${selectField('Comunidade','community',[['','Todas'],...db.communities.map(c=>[c.id,c.name])],filters.community)}${selectField('Sistema','system',[['','Todos'],...systems.map(s=>[s,s])],filters.system)}${selectField('Dia da semana','day',[['','Todos'],...dnames.map((d,i)=>[String(i),d])],filters.day)}${selectField('Modalidade','mode',[['','Todas'],['Online','Online'],['Presencial','Presencial'],['Híbrida','Híbrida']],filters.mode)}${selectField('Vagas','availability',[['','Todas'],['yes','Disponíveis'],['no','Lotadas']],filters.availability)}${selectField('Comunidade','cost',[['','Todas'],['free','Gratuita'],['paid','Por assinatura']],filters.cost)}</div><div class="form-actions"><button class="btn solidgreen sm" type="submit">Aplicar filtros</button></div></form><div class="panel-title"><h3>${filtered.length} mesa${filtered.length===1?'':'s'} encontrada${filtered.length===1?'':'s'}</h3>${tag('Dados demonstrativos','dim')}</div><div class="explore-layout"><div>${filtered.length?`<div class="card-grid">${filtered.map(t=>tableCard(t,true)).join('')}</div>`:empty('Nenhuma mesa corresponde aos filtros. Altere os critérios e tente novamente.')}</div>${tableDetail(table(selectedTableId))}</div>`;
}

function loginPage(){let login=authTab==='login';return `<div class="site-container"><div class="auth-wrap"><div class="auth-lead"><span class="glyph">D20</span><span class="eyebrow">Bem-vindo à Aurorium</span><h1>Mais que um jogo.<br><span class="gold">Uma comunidade.</span></h1><p>Descubra mesas, crie campanhas e acompanhe suas aventuras com uma experiência simples e organizada.</p><div class="feature-strip"><div class="feature">⚔ Mesas organizadas</div><div class="feature">▦ Agenda centralizada</div></div></div><div class="auth-main"><div class="auth-tabs"><button class="${login?'active':''}" data-action="auth-login">Entrar</button><button class="${!login?'active':''}" data-action="auth-signup">Criar conta</button></div>${login?`<h2>Acesse sua conta</h2><p class="small">Acesso demonstrativo: escolha uma conta abaixo ou informe o e-mail de uma conta local.</p><form id="login-form" class="form-grid">${field('E-mail','email','jogador@demo.rpg','email','required')}<div class="field" style="align-self:end"><button class="btn full" type="submit">Entrar no sistema</button></div></form><div class="divider"></div><h3>Modo demonstração</h3><p class="small">Contas pré-configuradas para apresentar os três perfis do TCC.</p><div class="auth-demo"><button data-action="switch-user" data-id="u_player">♙<br>Jogador</button><button data-action="switch-user" data-id="u_m1">⚔<br>Mestre</button><button data-action="switch-user" data-id="u_admin">♜<br>Administrador</button></div>`:`<h2>Criar conta de jogador</h2><p class="small">O cadastro é local e serve apenas para testar a plataforma.</p><form id="signup-form" class="form-grid">${field('Nome completo','name','','text','required')}${field('E-mail','email','','email','required')}${field('Nome de usuário','username','','text','required')}${field('Telefone (opcional)','phone','','tel')}<div class="field span2"><label><input type="checkbox" name="ack" required> Entendo que esta é uma versão demonstrativa, sem conta online real.</label>< function miniCalendar(sessions){const date=new Date();date.setMonth(date.getMonth()+calOffset);const y=date.getFullYear(),m=date.getMonth(),first=new Date(y,m,1).getDay(),size=new Date(y,m+1,0).getDate(),cells=[];for(let i=0;i<first;i++)cells.push(`<div class="cal-cell cal-empty"></div>`);for(let d=1;d<=size;d++){const dateKey=iso(new Date(y,m,d)),hit=sessions.some(s=>s.date===dateKey);cells.push(`<div class="cal-cell ${dateKey===today()?'today':''} ${hit?'has-event':''}" title="${hit?'Há sessão neste dia':''}">${d}</div>`)}return `<div class="cal-head"><button data-action="cal-prev" aria-label="Mês anterior">‹</button><strong>${date.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</strong><button data-action="cal-next" aria-label="Próximo mês">›</button></div><div class="calendar">${weekdays.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells.join('')}</div>`}

function playerDashboard(){let accepted=myAccepted(),requests=db.requests.filter(r=>r.userId===currentId),up=futureSessions(),myN=db.notices.filter(n=>n.userId===currentId).slice(0,5);return head(`Bem-vindo de volta, ${esc(me().name.split(' ')[0])}`,'Acompanhe suas mesas, sessões e descobertas de novas campanhas.',btn('Explorar Mesas','go-explore','','solidgreen'))+`<div class="stats">${stat('⚔',accepted.length,'Minhas Mesas')}${stat('▦',up.length,'Próximas Sessões')}${stat('✉',requests.filter(r=>r.status==='pending').length,'Solicitações Pendentes')}${stat('◷',requests.filter(r=>r.status==='waitlisted').length,'Listas de Espera')}</div><div class="three-cols"><div class="stack">${panel('Agenda do Mês',miniCalendar(up),btn('Ver calendário','go-calendar'))}${panel('Minhas Comunidades',`<div class="panel-list">${db.communities.filter(c=>me().joined?.includes(c.id)).map(c=>`<div class="list-row"><div class="info"><h4>${esc(c.name)}</h4><p>${c.type==='paid'?'Por assinatura':'Gratuita'}</p></div>${btn('Ver','select-community',`data-id="${attr(c.id)}"`)}</div>`).join('')||empty('Você ainda não participa de uma comunidade.')}</div>`)}</div><div class="stack">${panel('Próximas Sessões',sessionList(up,6),btn('Agenda completa','go-calendar'))}${panel('Minhas Mesas',`<div class="panel-list">${accepted.map(t=>`<div class="list-row"><div class="info"><h4>${esc(t.name)}</h4><p>${esc(t.system)} · ${esc(t.time)}</p></div>${btn('Ver','select-table',`data-id="${attr(t.id)}"`)}</div>`).join('')||empty('Você ainda não está participando de uma mesa.')}</div>`)}</div><div class="stack">${panel('Notificações',notificationRows(myN),btn('Ver todas','go-notices'))}${panel('Solicitações',`<div class="panel-list">${requests.slice(0,5).map(x=>`<div class="list-row"><div class="info"><h4>${esc(table(x.tableId)?.name||'')}</h4><p>${prettyDate(x.date)}</p></div>${statusTag(x.status)}</div>`).join('')||empty('Nenhuma solicitação.')}</div>`,btn('Ver todas','go-requests'))}</div></div>`}
function masterDashboard(){let tabs=myTables(),allRequests=db.requests.filter(r=>tabs.some(t=>t.id===r.tableId)),up=futureSessions(),approved=tabs.reduce((a,t)=>a+members(t.id).length,0),past=db.sessions.filter(s=>tabs.some(t=>t.id===s.tableId)&&s.date<today()),pres=0,total=0;past.forEach(s=>{Object.values(s.attendance||{}).forEach(v=>{if(v!=='unknown'){total++;if(v==='present')pres++}})});return head('Painel do Mestre','Gerencie campanhas, solicitações e acompanhe suas aventuras.',btn('＋ Criar nova mesa','new-table','','solidgreen'))+`<div class="stats">${stat('⚔',tabs.filter(t=>t.status==='open').length,'Mesas Ativas')}${stat('♙',approved,'Jogadores Vinculados')}${stat('✧',tabs.reduce((a,t)=>a+slots(t),0),'Vagas Disponíveis')}${stat('✉',allRequests.filter(r=>r.status==='pending').length,'Solicitações Pendentes')}${stat('◷',allRequests.filter(r=>r.status==='waitlisted').length,'Lista de Espera')}${stat('▦',up.length,'Sessões Futuras')}${stat('✓',total?Math.round(100*pres/total)+'%':'0%','Taxa de Presença')}${stat('⬡',me().masterCommunities?.length||0,'Comunidades de Mestre')}</div><div class="columns"><div class="stack">${panel('Minhas Mesas Ativas',`<div class="card-grid">${tabs.map(t=>`<div>${tableCard(t,true)}<div style="margin-top:6px">${btn('Gerenciar','edit-table',`data-id="${attr(t.id)}"`,'neutral')}</div></div>`).join('')||empty('Nenhuma mesa cadastrada.')}</div>`,btn('Criar mesa','new-table'))}${panel('Próximas Sessões',sessionList(up,7),btn('Abrir calendário','go-calendar'))}</div><div class="stack">${panel('Solicitações Pendentes',`<div class="panel-list">${allRequests.filter(r=>r.status==='pending').slice(0,7).map(r=>`<div class="list-row"><div class="info"><h4>${esc(user(r.userId)?.name||'')}</h4><p>${esc(table(r.tableId)?.name||'')}</p></div><div class="row-action">${btn('✓','approve-request',`data-id="${attr(r.id)}"`,'solidgreen')}${btn('✕','reject-request',`data-id="${attr(r.id)}"`,'danger')}</div></div>`).join('')||empty('Nenhuma solicitação penden function reportsPage(){if(me().role!=='admin')return head('Acesso restrito','Somente Administradores.');let allowed=db.communities.filter(c=>adminAllowed(c)),tables=db.tables.filter(t=>allowed.some(c=>c.id===t.communityId)),requests=db.requests.filter(r=>tables.some(t=>t.id===r.tableId));let sessionCount=db.sessions.filter(s=>tables.some(t=>t.id===s.tableId)).length;return head('Relatórios','Indicadores calculados a partir dos registros locais.')+`<div class="stats">${stat('⚔',tables.length,'Mesas')}${stat('✉',requests.length,'Solicitações')}${stat('▦',sessionCount,'Sessões')}${stat('♙',db.users.filter(u=>u.joined?.some(id=>allowed.some(c=>c.id===id))).length,'Membros')}</div><div class="two-up">${panel('Ocupação por Mesa',bars(tables.map(t=>({label:t.name,value:members(t.id).length,max:t.capacity}))))}${panel('Solicitações por Situação',bars(['approved','pending','rejected','waitlisted'].map(s=>({label:statusTxt(s),value:requests.filter(r=>r.status===s).length,max:requests.length||1}))))}${panel('Participação por Comunidade',bars(allowed.map(c=>({label:c.name,value:db.users.filter(u=>u.joined?.includes(c.id)).length,max:db.users.length}))))}${panel('Controle de Presença',(()=>{const counters={present:0,absent:0};db.sessions.filter(s=>tables.some(t=>t.id===s.tableId)).forEach(s=>Object.values(s.attendance||{}).forEach(v=>{if(v in counters)counters[v]++}));return bars([{label:'Presenças',value:counters.present,max:Math.max(1,counters.present+counters.absent)},{label:'Ausências',value:counters.absent,max:Math.max(1,counters.present+counters.absent)}])})())}</div>`}

function profilePage(){let u=me();return head('Meu Perfil','Edite seus dados pessoais e disponibilidade.',btn('Trocar conta','go-login','','neutral'))+`<div class="columns"><form id="profile-form" class="panel panel-pad"><div class="form-grid">${field('Nome completo','name',u.name,'text','required')}${field('E-mail','email',u.email,'email','required')}${field('Telefone (opcional)','phone',u.phone||'','tel')}${selectField('Modalidade preferida','mode',[['Online','Online'],['Presencial','Presencial'],['Híbrida','Híbrida']],u.mode||'Online')}<div class="field span2"><span class="field-label">Sistemas favoritos</span><div class="checkrow">${systems.map(s=>`<label><input type="checkbox" name="systems" value="${attr(s)}" ${u.systems?.includes(s)?'checked':''}>${esc(s)}</label>`).join('')}</div></div><div class="field span2"><span class="field-label">Dias disponíveis</span>${checkDays(u.days||[])}</div></div><div class="form-actions"><button class="btn" type="submit">Salvar Perfil</button></div></form><div class="stack">${panel('Conta de demonstração',`<div class="list-row">${personAvatar(u)}<div class="info"><h4>${esc(u.name)}</h4><p>${esc(u.email)}</p></div>${tag(rolePt[u.role],'gold')}</div><p class="footnote">Esta conta é local. Não há autenticação de produção nem sincronização entre dispositivos.</p>`)}${u.role==='player'?panel('Deseja ser Mestre?',`<p>Solicite ao administrador de uma comunidade autorização para criar e gerenciar mesas.</p><div class="form-actions">${btn('Solicitar habilitação','open-master-application','','solidgreen')}</div>`):''}${panel('Dados da demonstração',`<p>Os registros ficam armazenados no navegador usado para abrir o HTML.</p><button class="btn danger sm" data-action="reset-demo">Restaurar dados originais</button>`)}</div></div>`}

 case 'read-all':db.notices.filter(n=>n.userId===currentId).forEach(n=>n.read=true);save();render();toast('Notificações marcadas como lidas.');break;
 case 'revoke-whatsapp':me().notify.whatsapp=false;save();render();toast('Autorização de WhatsApp revogada.');break;
 case 'reset-demo':if(!confirmAction('Restaurar dados originais? Todas as alterações locais serão perdidas.'))return;db=seed();save();currentId='u_player';localStorage.setItem(SESSION,currentId);route='home';filters={search:'',community:'',system:'',day:'',mode:'',availability:'',cost:''};render();toast('Dados de demonstração restaurados.');break;
 case 'close-modal':$('#modal-overlay')?.remove();break;
 }
}
function announceVacancy(t){if(!slots(t))return;db.requests.filter(x=>x.tableId===t.id&&x.status==='waitlisted').forEach(r=>notify(r.userId,'vacancy',`Uma vaga surgiu em ${t.name}. Acesse a mesa para conferir a disponibilidade.`,'explore'))}
function getform(form){return new FormData(form)}
function submitForm(e){const form=e.target;if(!form.id)return;e.preventDefault();const fd=getform(form),val=n=>String(fd.get(n)||'').trim();const present=n=>fd.has(n);
 try{
 switch(form.id){
 case 'filter-form':filters={search:val('search'),community:val('community'),system:val('system'),day:val('day'),mode:val('mode'),availability:val('availability'),cost:val('cost')};render();break;
 case 'login-form':{let u=db.users.find(x=>x.email.toLowerCase()===val('email').toLowerCase());if(!u)return toast('E-mail não encontrado entre as contas demonstrativas.',true);currentId=u.id;localStorage.setItem(SESSION,currentId);go('dashboard');toast('Acesso demonstrativo realizado.');break}
 case 'signup-form':{
  if(!val('name')||!val('email')||!val('username')||!present('ack'))return toast('Preencha os campos obrigatórios.',true);
  if(db.users.some(u=>u.email.toLowerCase()===val('email').toLowerCase()))return toast('Já existe uma conta com este e-mail.',true);
  const u={id:uid('u'),name:val('name'),email:val('email'),username:val('username'),role:'player',joined:[],masterCommunities:[],systems:[],days:[],phone:val('phone'),mode:'Online',notify:{inApp:true,whatsapp:false,types:['vacancy','approval','session'],lead:3,hours:'09:00-21:00'}};
  db.users.push(u);currentId=u.id;localStorage.setItem(SESSION,currentId);save();go('dashboard');toast('Conta demonstrativa criada com sucesso.');break}
 case 'table-form':{
  if(me().role==='player')return;const original=table(editTableId),community=comm(val('communityId'));
  if(!(me().role==='admin'&&adminAllowed(community)||me().role==='master'&&me().masterCommunities?.includes(community?.id)))return toast('Você não pode publicar mesas nesta comunidade.',true);
  let ds=fd.getAll('days').map(Number),max=Number(val('capacity')),begin=val('start'),end=val('end'),rep=val('recurrence');
  if(!val('name')||!val('description')||!begin||!end||end<begin||!Number.isInteger(max)||max<1||max>30)return toast('Confira nome, descrição, datas e capacidade (1 a 30).',true);
  if(rep!=='once'&&rep!=='monthly'&&!ds.length)return toast('Escolha ao menos um dia da semana.',true);
  if(original&&max<members(original.id).length)return toast('Capacidade menor que a quantidade de participantes aprovados.',true);
  const obj={name:val('name'),system:val('system'),communityId:val('communityId'),mode:val('mode'),genre:val('genre'),status:val('status'),description:val('description'),capacity:max,waitlist:present('waitlist'),rules:val('rules'),start:begin,end,time:val('time'),duration:Number(val('duration'))||3,days:ds,recurrence:rep};
  const changed=original&&['start','end','time','recurrence'].some(k=>String(original[k])!==String(obj[k]))||original&&JSON.stringify(original.days)!==JSON.stringify(obj.days);
  if(changed&&!confirmAction('O agendamento foi alterado. Substituir as sessões futuras pela nova programação? Presenças de sessões anteriores serão preservadas.'))return;
  if(original){Object.assign(original,obj);if(changed){db.sessions=db.sessions.filter(s=>s.tableId!==original.id||s.date<today());db.sessions.push(...makeSchedule(original.id,obj.start,obj.end,obj.days,obj.recurrence,obj.time,obj.duration,uid('series'),80).filter(s=>s.date>=today()));notifyParticipants(original,'session',`A programação da mesa ${original.name} foi atualizada.`)}}
  else{const t={id:uid('t'),masterId:currentId,...obj};db.tables.push(t);db.sessions.push(...makeSchedule(t.id,obj.start,obj.end,obj.days,obj.recurrence,obj.time,obj.duration,uid('series'),80));selectedTableId=t.id;activity(`Mesa ${t.name} cadastrada por ${me().name}`)}
  save();editTableId=null;go('my-tables');toast(original?'Mesa atualizada com sucesso.':'Mesa publicada com sucesso.');break}
 case 'session-form':{
  if(me().role==='player')return;const t=table(val('tableId'));
  if(!t||!masterAllowed(t))return toast('Mesa indisponível ou sem permissão.',true);
  const date=val('date'),time=val('time'),duration=Number(val('duration')),title=val('title');if(!date||!time||!title||duration<1||duration>12)return toast('Preencha data, título, horário e duração válidos.',true);
  const original=db.sessions.find(s=>s.id===editSessionId);
  if(original){const old=table(original.tableId);if(!masterAllowed(old)||old.id!==t.id)return toast('Edição de mesa diferente não permitida.',true);
   const offset=Math.round((new Date(date+'T12:00:00')-new Date(original.date+'T12:00:00'))/86400000),affected=val('scope')==='future'?db.sessions.filter(s=>s.seriesId===original.seriesId&&s.tableId===t.id&&s.date>=original.date):[original];
   affected.forEach(s=>{s.date=plusDays(s.date,offset);s.time=time;s.duration=duration;s.title=title;s.status='scheduled'});notifyParticipants(t,'session',`A sessão de ${t.name} foi atualizada para ${prettyDate(date)} às ${time}.`);activity(`Sessão de ${t.name} alterada`);toast('Agendamento atualizado.');
  }else{const repeat=val('recurrence'),days=fd.getAll('days').map(Number),end=repeat==='once'?date:val('end');if(end<date)return toast('Data final anterior à data inicial.',true);if(['weekly','biweekly'].includes(repeat)&&!days.length)return toast('Selecione ao menos um dia da semana.',true);const created=makeSchedule(t.id,date,end,days,repeat,time,duration,uid('series'),80);if(!created.length)return toast('Não há ocorrências nas datas e dias selecionados.',true);created.forEach(s=>s.title=title);db.sessions.push(...created);notifyParticipants(t,'session',`${created.length} sessão(ões) agendada(s) na mesa ${t.name}.`);activity(`${created.length} sessão(ões) criada(s) em ${t.name}`);toast(`${created.length} sessão(ões) criada(s).`)}
  save();editSessionId=null;go('calendar');break}
 case 'attendance-form':{
  const s=db.sessions.find(x=>x.id===attendanceSessionId),t=table(s?.tableId);if(!s||!masterAllowed(t))return;const newAttendance={...(s.attendance||{})};members(t.id).forEach(r=>newAttendance[r.userId]=val('a_'+r.userId)||'unknown');s.attendance=newAttendance;activity(`Presença registrada em ${t.name} (${prettyDate(s.date)})`);save();render();toast('Presenças registradas.');break}
 case 'community-form':{
  if(me().role!=='admin')return;const name=val('name'),description=val('description'),fee=Number(val('fee'));if(!name||!description||fee<0)return toast('Preencha nome, descrição e valor válido.',true);let c=comm(editCommunityId);if(c&&!adminAllowed(c))return;let obj={name,description,type:val('type'),fee:val('type')==='paid'?fee:0,active:present('active'),rules:val('rules')};if(c)Object.assign(c,obj);else{c={id:uid('c'),adminId:currentId,...obj};db.communities.push(c);me().joined.push(c.id)}activity(`Comunidade ${name} salva`);save();editCommunityId=null;go('admin-communities');toast('Comunidade salva.');break}
 case 'due-form':{
  if(me().role!=='admin')return;const c=comm(val('communityId'));if(!adminAllowed(c)||c.type!=='paid')return toast('Comunidade inválida.',true);if(!user(val('userId'))?.joined?.includes(c.id))return toast('Membro não pertence à comunidade selecionada.',true);if(db.dues.some(d=>d.communityId===c.id&&d.userId===val('userId')&&d.period===val('period')))return toast('Já existe um registro dessa competência para o membro.',true);if(Number(val('amount'))<0)return toast('Valor inválido.',true);db.dues.push({id:uid('d'),communityId:c.id,userId:val('userId'),period:val('period'),amount:Number(val('amount')),due:val('due'),status:val('status')});save();render();toast('Mensalidade registrada.');break}
 case 'preferences-form':{
  const u=me();u.phone=val('phone');if(present('whatsapp')&&!u.phone)return toast('Informe seu telefone para autorizar a simulação do WhatsApp.',true);u.notify={inApp:present('inApp'),whatsapp:present('whatsapp'),types:fd.getAll('types'),lead:Number(val('lead')),hours:val('hours')};save();render();toast('Preferências atualizadas.');break}
 case 'profile-form':{
  const u=me();if(!val('name')||!val('email'))return toast('Nome e e-mail são obrigatórios.',true);
  if(db.users.some(x=>x.id!==u.id&&x.email.toLowerCase()===val('email').toLowerCase()))return toast('E-mail já utilizado por outro usuário.',true);
  Object.assign(u,{name:val('name'),email:val('email'),phone:val('phone'),mode:val('mode'),systems:fd.getAll('systems'),days:fd.getAll('days').map(Number)});save();render();toast('Perfil atualizado.');break}
 case 'remove-member-form':{
  if(me().role!=='admin')return;const u=user(val('userId')),c=comm(val('communityId'));if(!u||!c||!adminAllowed(c)||!u.joined.includes(c.id))return;
  if(db.tables.some(t=>t.masterId===u.id&&t.communityId===c.id&&t.status==='open'))return toast('Este Mestre possui mesas ativas nesta comunidade.',true);
  if(!confirmAction(`Remover ${u.name} de ${c.name}?`))return;
  u.joined=u.joined.filter(cid=>cid!==c.id);u.masterCommunities=(u.masterCommunities||[]).filter(cid=>cid!==c.id);if(u.role==='master'&&!u.masterCommunities.length)u.role='player';
  const removed=db.requests.filter(r=>r.userId===u.id&&table(r.tableId)?.communityId===c.id&&r.status==='approved').map(r=>table(r.tableId));
  db.requests.forEach(r=>{if(r.userId===u.id&&table(r.tableId)?.communityId===c.id)r.status='cancelled'});
  removed.filter(Boolean).forEach(t=>announceVacancy(t));notify(u.id,'community',`Você foi removido da comunidade ${c.name}.`,'communities');save();$('#modal-overlay')?.remove();render();toast('Vínculo com comunidade removido.');break}
 case 'master-app-form':{
  if(me().role!=='player')return;const c=comm(val('communityId'));if(!c||!me().joined.includes(c.id))return;const previous=db.masterApplications.find(x=>x.userId===currentId&&x.communityId===c.id&&x.status==='pending');if(previous)return toast('Solicitação já enviada para esta comunidade.',true);db.masterApplications.push({id:uid('m'),userId:currentId,communityId:c.id,status:'pending',date:today()});notify(c.adminId,'request',`${me().name} solicitou habilitação como Mestre em ${c.name}.`,'admin-users');save();$('#modal-overlay')?.remove();render();toast('Solicitação de Mestre enviada.');break}
 }
 }catch(err){console.error(err);toast('Ocorreu um erro ao salvar. Consulte o console do navegador.',true)}
}
document.addEventListener('click',e=>runAction(e));
document.addEventListener('submit',e=>submitForm(e));
document.addEventListener('change',e=>{const el=e.target;if(el.matches('select[data-dues-id]')){const d=db.dues.find(d=>d.id===el.dataset.duesId);if(d&&adminAllowed(comm(d.communityId))){d.status=el.value;activity(`Situação de mensalidade atualizada para ${statusTxt(d.status)}`);save();render();toast('Situação atualizada.')}else toast('Ação sem autorização.',true)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='topsearch'){e.preventDefault();filters={search:e.target.value.trim(),community:'',system:'',day:'',mode:'',availability:'',cost:''};go('explore')}if(e.key==='Escape'){$('#modal-overlay')?.remove();if(showSidebar){showSidebar=false;render()}}});
document.addEventListener('input',e=>{if(e.target.name==='name'&&e.target.closest('#table-form')){const h=$('#table-preview-title');if(h)h.textContent=e.target.value||'Sua nova mesa'}});
render();
</script>
</body>
</html>
