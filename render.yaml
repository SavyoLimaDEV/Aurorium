services:
  - type: web
    name: aurorium-v2
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: production
      - key: AURORIUM_DB
        value: /tmp/aurorium.sqlite
